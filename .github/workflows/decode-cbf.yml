name: Build CBF Decoder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name CBFDecoder cbf_decoder.py

      - name: Test EXE
        run: |
          .\dist\CBFDecoder.exe --help

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CBFDecoder-Windows
          path: dist\CBFDecoder.exe

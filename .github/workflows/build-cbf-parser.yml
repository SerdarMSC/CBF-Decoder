name: Build CBF Parser

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Syntax check
        run: |
          python -m py_compile cbf_parser.py
          python -m py_compile caesar_struct.py

      - name: Build EXEs
        run: |
          pyinstaller --onefile --clean --name CBFParser cbf_parser.py
          pyinstaller --onefile --clean --name CaesarStruct caesar_struct.py

      - name: Test EXEs
        run: |
          .\dist\CBFParser.exe --help
          .\dist\CaesarStruct.exe --help

      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: CBFParser-Windows
          path: |
            dist\CBFParser.exe
            dist\CaesarStruct.exe
          if-no-files-found: error
